  <style>
    :root {
      --cream: #F3EFE7;
      --purple-deep: #4B3F8F;
      --purple: #6B4FAE;
      --terracotta: #A3462F;
      --terracotta-light: #d9824f;
      --ink: #1c1c1c;
      --muted: #5C544A;
      --page: #E4DDD2;
      --page-deep: #D8CFC1;
      --flip-duration: 700ms;
      --flip-ease: cubic-bezier(.65, .05, .36, 1);
      --font: "Inter", system-ui, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html {
      background: var(--page-deep);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
      overflow-x: clip;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(130% 75% at 50% 0%, #EEE8DF 0%, rgba(238, 232, 223, 0) 62%),
        linear-gradient(180deg, var(--page) 0%, var(--page-deep) 100%);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-area {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
    }

    /* Soft blue/violet light behind the card */
    .halo {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: -1;
      width: min(175%, 100vw);
      aspect-ratio: 1.5;
      translate: -50% -50%;
      pointer-events: none;
      background:
        radial-gradient(closest-side at 42% 48%, rgba(107, 79, 174, .30), rgba(107, 79, 174, 0)),
        radial-gradient(closest-side at 60% 56%, rgba(74, 112, 220, .20), rgba(74, 112, 220, 0));
    }

    /* ---------- 3D scene ----------
       scene  : perspective + pointer input (never transformed, so its hit box stays stable)
       intro  : entrance animation
       tilt   : pointer / gyroscope rotation (set from JS)
       card   : the 180° flip
       Each layer keeps preserve-3d so the faces live in one shared 3D space. */
    .scene {
      position: relative;
      width: min(88vw, 420px);
      aspect-ratio: 90 / 50;
      perspective: 950px;
      container-type: inline-size;
      touch-action: none;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      animation: scene-in .5s ease-out both;
    }

    /* Slightly larger hover zone so the tilt doesn't jitter at the edges */
    .scene::before {
      content: "";
      position: absolute;
      inset: -20px -12px;
    }

    /* The accessible flip control. It sits under the card (the card is its visual),
       so links on the faces stay outside of it. */
    .card-btn {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .card-btn:focus { outline: none; }

    .shadow {
      position: absolute;
      pointer-events: none;
      border-radius: 10px;
      will-change: transform;
    }
    .shadow--far {
      inset: 10% 5% -7%;
      background: rgba(45, 30, 80, .34);
      filter: blur(22px);
    }
    .shadow--near {
      inset: 4% 2% -2%;
      background: rgba(30, 22, 40, .36);
      filter: blur(6px);
    }

    .intro,
    .tilt,
    .card {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }
    .intro { animation: card-in 1.1s cubic-bezier(.16, .84, .24, 1) both; }
    .tilt { will-change: transform; }
    .card { transition: transform var(--flip-duration) var(--flip-ease); }
    .card.is-flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 3px;
      color: var(--ink);
      background: linear-gradient(160deg, #F6F3EC 0%, var(--cream) 45%, #EFEAE1 100%);
      box-shadow: 0 0 0 1px rgba(28, 28, 28, .05), 0 1px 1px rgba(28, 28, 28, .06);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      /* Type scales with the card: 14px when the card is 343px wide (88% of a 390px phone) */
      font-size: 14px;
      font-size: calc(100cqw * 14 / 343);
    }
    /* Safari only honours backface-visibility on elements that have a 3D transform,
       hence the explicit rotateY(0) on the front. The back starts turned away. */
    .face--front { transform: rotateY(0deg); }
    .face--back { transform: rotateY(180deg); }

    .scene.has-focus .face {
      outline: 3px solid var(--purple-deep);
      outline-offset: 4px;
    }

    [inert] { pointer-events: none; }

    /* Moving reflection. It sits beneath the text so it never lowers text contrast. */
    .glare {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: var(--glare, 0);
      background:
        radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, .95) 0%, rgba(255, 255, 255, .4) 22%, rgba(255, 255, 255, 0) 52%),
        radial-gradient(circle at calc(100% - var(--gx, 50%)) calc(100% - var(--gy, 50%)), rgba(75, 63, 143, .10), rgba(75, 63, 143, 0) 60%);
    }

    .face__body {
      position: relative;
      z-index: 1;
      height: 100%;
    }

    .stripe {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      height: .6em;
      background: linear-gradient(90deg, var(--terracotta), var(--terracotta-light));
    }

    .rule {
      display: block;
      width: 2.72em; /* ≈10 mm on a 90 mm card */
      height: max(1.5px, .11em);
      background: var(--terracotta);
    }

    /* ---------- Front ---------- */
    .face__body--front {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.05em 1.6em 1.5em;
    }

    .monogram {
      position: absolute;
      top: 1.05em;
      right: 1.6em;
      width: 2.45em;
      height: 2.45em;
      display: grid;
      place-items: center;
      border: max(1.5px, .1em) solid var(--purple-deep);
      border-radius: 2px;
      color: var(--purple-deep);
      font-size: 1em;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1;
    }

    .name {
      margin: 0;
      font-size: 1.7em;
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.05;
      white-space: nowrap;
    }

    .role {
      margin: 0;
      font-size: 1em;
      font-weight: 600;
      letter-spacing: .18em;
      line-height: 1.25;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--ink);
    }
    .name + .role { margin-top: .42em; }
    .role--accent { color: var(--purple); }
    .role + .rule { margin-top: .78em; }

    .contacts {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: .32em;
      justify-items: start;
    }
    .contacts a {
      display: inline-flex;
      align-items: center;
      gap: .62em;
      padding: .16em .25em .16em 0;
      margin: -.16em 0;
      border-radius: 3px;
      color: var(--ink);
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none;
      white-space: nowrap;
    }
    .contacts svg {
      flex: none;
      width: 1.12em;
      height: 1.12em;
      fill: var(--purple);
    }

    /* ---------- Back ---------- */
    .face__body--back {
      display: flex;
      align-items: center;
      gap: 1.45em;
      padding: .9em 1.6em 1.5em;
    }

    /* Four terracotta corner brackets drawn on the frame's padding,
       so they sit outside the white QR box without touching it. */
    .qr-frame {
      --c: var(--terracotta);
      --t: max(1.5px, .12em);
      --l: 1.25em;
      flex: none;
      padding: .55em;
      background:
        linear-gradient(var(--c) 0 0) left top / var(--l) var(--t),
        linear-gradient(var(--c) 0 0) left top / var(--t) var(--l),
        linear-gradient(var(--c) 0 0) right top / var(--l) var(--t),
        linear-gradient(var(--c) 0 0) right top / var(--t) var(--l),
        linear-gradient(var(--c) 0 0) left bottom / var(--l) var(--t),
        linear-gradient(var(--c) 0 0) left bottom / var(--t) var(--l),
        linear-gradient(var(--c) 0 0) right bottom / var(--l) var(--t),
        linear-gradient(var(--c) 0 0) right bottom / var(--t) var(--l);
      background-repeat: no-repeat;
    }
    .qr {
      width: 8.6em;
      aspect-ratio: 1;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(28, 28, 28, .06);
    }
    .qr svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .qr--fallback {
      display: grid;
      place-items: center;
      padding: .5em;
      font-size: 1em;
      font-weight: 500;
      line-height: 1.3;
      text-align: center;
      color: var(--muted);
    }

    .cta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
    }
    .cta__label {
      margin: 0;
      font-size: 1em;
      font-weight: 600;
      letter-spacing: .2em;
      line-height: 1.35;
      text-transform: uppercase;
    }
    .cta__label span { display: block; }
    .cta .rule { margin: .75em 0 .7em; }
    .cta__url {
      border-radius: 3px;
      color: var(--purple);
      font-size: 1.08em;
      font-weight: 600;
      white-space: nowrap;
      text-decoration: underline;
      text-decoration-color: rgba(107, 79, 174, .4);
      text-decoration-thickness: max(1px, .07em);
      text-underline-offset: .22em;
    }

    .contacts a:focus-visible,
    .cta__url:focus-visible {
      outline: 2px solid var(--purple-deep);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .contacts a:hover span {
        text-decoration: underline;
        text-decoration-color: var(--purple);
        text-underline-offset: .22em;
      }
      .cta__url:hover { text-decoration-color: var(--purple); }
    }

    /* ---------- Controls ---------- */
    .controls {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 44px;
      animation: rise .6s .45s cubic-bezier(.2, .8, .2, 1) both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(28, 28, 28, .14);
      border-radius: 999px;
      background: rgba(255, 255, 255, .55);
      color: var(--ink);
      font: 600 15px/1 var(--font);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-shadow: 0 1px 2px rgba(28, 28, 28, .06);
      transition: background-color .2s, transform .15s;
    }
    .btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn--primary {
      border-color: var(--purple-deep);
      background: var(--purple-deep);
      color: var(--cream);
    }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible {
      outline: 3px solid var(--purple-deep);
      outline-offset: 3px;
    }
    @media (hover: hover) {
      .btn:hover { background: rgba(255, 255, 255, .85); }
      .btn--primary:hover { background: #3E3378; }
    }

    .hint {
      margin: 16px 0 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-align: center;
      animation: rise .6s .55s cubic-bezier(.2, .8, .2, 1) both;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 10;
      max-width: calc(100vw - 32px);
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--cream);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      text-align: center;
      overflow-wrap: anywhere;
      box-shadow: 0 8px 24px rgba(28, 28, 28, .2);
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: opacity .25s, transform .25s;
    }
    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes scene-in { from { opacity: 0; } }

    @keyframes card-in {
      0%   { transform: translate3d(0, 8%, -120px) rotateX(16deg) rotateY(-26deg) rotateZ(-3deg); }
      62%  { transform: translate3d(0, -1%, 0) rotateX(-2deg) rotateY(5deg) rotateZ(.4deg); }
      100% { transform: none; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene, .intro, .controls, .hint { animation: none; }
      /* No rotation at all: flipping becomes a cross-fade between the faces. */
      .card, .card.is-flipped { transform: none; transition: none; }
      .face { transition: opacity 320ms ease; }
      .face--back { transform: none; opacity: 0; }
      .card.is-flipped .face--front { opacity: 0; }
      .card.is-flipped .face--back { opacity: 1; }
      .glare { display: none; }
      .btn, .toast { transition: opacity .2s; }
    }
  </style>
</head>

    <p class="hint" id="hint">Tap the card to flip</p>
  </main>

  <p class="sr-only" id="flipStatus" aria-live="polite"></p>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    const PORTFOLIO_URL = 'https://www.judithpcdev.com';
    const SHARE_TITLE = 'Judith Pérez — Full-Stack Developer';
    const MAX_TILT = 12;   // degrees, per axis
    const FLIP_MS = 700;   // keep in sync with --flip-duration
    const FLIP_EASE = 'cubic-bezier(.65, .05, .36, 1)';

    const $ = (id) => document.getElementById(id);
    const scene = $('scene'), tilt = $('tilt'), card = $('card');
    const front = $('front'), back = $('back');
    const cardBtn = $('cardBtn'), flipBtn = $('flipBtn'), shareBtn = $('shareBtn'), motionBtn = $('motionBtn');
    const halo = $('halo'), shadowNear = $('shadowNear'), shadowFar = $('shadowFar');
    const flipStatus = $('flipStatus'), toastEl = $('toast'), hint = $('hint'), qrBox = $('qr');

    const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
    const reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');
    const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
    const coarsePointer = matchMedia('(pointer: coarse)');
    let reduced = reducedQuery.matches;

    /* ---------------- Tilt state ---------------- */
    const target = { x: 0, y: 0 };    // rotateX / rotateY we ease towards (deg)
    const current = { x: 0, y: 0 };   // rotateX / rotateY currently rendered (deg)
    let pointerActive = false;
    let gyroLive = false;
    let gyroTarget = null;
    let press = null;
    let dragged = false;
    let rect = null;
    let sceneWidth = scene.offsetWidth;
    let raf = 0;
    let lastFrame = 0;

    /* ---------------- Flip ---------------- */
    let flipped = false;

    function flip() {
      flipped = !flipped;
      card.classList.toggle('is-flipped', flipped);
      // Only the visible face can be focused, clicked or read by screen readers.
      front.inert = flipped;
      back.inert = !flipped;
      flipStatus.textContent = flipped
        ? 'Showing back: QR code to judithpcdev.com'
        : 'Showing front: contact details';

      if (!reduced && card.animate) {
        // Lift the card and narrow its shadow as it passes edge-on (halfway through the flip).
        const timing = { duration: FLIP_MS, easing: FLIP_EASE };
        card.animate([{ scale: '1' }, { scale: '1.06' }, { scale: '1' }], timing);
        for (const s of [shadowNear, shadowFar]) {
          s.animate([
            { scale: '1 1', opacity: 1 },
            { scale: '.4 .9', opacity: .55 },
            { scale: '1 1', opacity: 1 }
          ], timing);
        }
      }
    }

    cardBtn.addEventListener('click', flip);
    flipBtn.addEventListener('click', flip);

    // The real <button> sits under the card, so mirror its keyboard focus ring onto the faces.
    cardBtn.addEventListener('focus', () => {
      let visible = true;
      try { visible = cardBtn.matches(':focus-visible'); } catch (_) { /* old browsers */ }
      scene.classList.toggle('has-focus', visible);
    });
    cardBtn.addEventListener('blur', () => scene.classList.remove('has-focus'));

    scene.addEventListener('click', (e) => {
      // Links keep working, the keyboard button already flipped, and a drag is not a tap.
      if (dragged || e.target.closest('a, button') || !e.target.closest('.card')) return;
      flip();
    });

    /* ---------------- Tilt (pointer) ---------------- */
    function aimAt(clientX, clientY) {
      rect = rect || scene.getBoundingClientRect();
      const nx = clamp(((clientX - rect.left) / rect.width) * 2 - 1, -1, 1);
      const ny = clamp(((clientY - rect.top) / rect.height) * 2 - 1, -1, 1);
      // In CSS, +rotateY pushes the right edge away and +rotateX pushes the top edge away,
      // so these signs turn the card to face the pointer.
      target.x = -ny * MAX_TILT;
      target.y = nx * MAX_TILT;
      animate();
    }

    function relax() {
      pointerActive = false;
      target.x = gyroTarget ? gyroTarget.x : 0;
      target.y = gyroTarget ? gyroTarget.y : 0;
      animate();
    }

    function animate() {
      if (!raf) {
        lastFrame = 0;
        raf = requestAnimationFrame(step);
      }
    }

    function step(now) {
      const dt = lastFrame ? clamp(now - lastFrame, 0, 50) : 16;
      lastFrame = now;
      // Frame-rate independent smoothing: snappy while following, softer when settling back.
      const tau = pointerActive ? 70 : gyroLive ? 120 : 280;
      const k = 1 - Math.exp(-dt / tau);
      current.x += (target.x - current.x) * k;
      current.y += (target.y - current.y) * k;
      const done = Math.abs(target.x - current.x) < 0.01 && Math.abs(target.y - current.y) < 0.01;
      if (done) {
        current.x = target.x;
        current.y = target.y;
      }
      render();
      raf = done ? 0 : requestAnimationFrame(step);
    }

    function render() {
      const { x, y } = current;
      tilt.style.transform = `rotateX(${x.toFixed(2)}deg) rotateY(${y.toFixed(2)}deg)`;

      // How far the card leans on each screen axis, -1…1 (same sign as the pointer offset).
      const lx = y / MAX_TILT;
      const ly = -x / MAX_TILT;
      const strength = Math.min(1, Math.hypot(lx, ly));
      card.style.setProperty('--gx', `${(50 + lx * 50).toFixed(1)}%`);
      card.style.setProperty('--gy', `${(50 + ly * 50).toFixed(1)}%`);
      card.style.setProperty('--glare', (strength * 0.9).toFixed(3));

      // Shadows slide opposite to the lean; the far, blurrier one moves more (parallax).
      const d = sceneWidth * 0.045;
      shadowFar.style.transform = `translate(${(-lx * d).toFixed(1)}px, ${(-ly * d).toFixed(1)}px)`;
      shadowNear.style.transform = `translate(${(-lx * d * 0.35).toFixed(1)}px, ${(-ly * d * 0.35).toFixed(1)}px)`;
      halo.style.transform = `translate(${(lx * d * 0.6).toFixed(1)}px, ${(ly * d * 0.6).toFixed(1)}px)`;
    }

    scene.addEventListener('pointerenter', () => { rect = null; });

    scene.addEventListener('pointerdown', (e) => {
      rect = null;
      press = { x: e.clientX, y: e.clientY };
      dragged = false;
      if (e.pointerType !== 'mouse' && !reduced) {
        pointerActive = true;
        aimAt(e.clientX, e.clientY);
      }
    });

    scene.addEventListener('pointermove', (e) => {
      if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) dragged = true;
      if (reduced) return;
      if (e.pointerType === 'mouse' || pointerActive) {
        pointerActive = true;
        aimAt(e.clientX, e.clientY);
      }
    });

    const release = (e) => {
      press = null;
      // A mouse keeps steering the tilt while it hovers; fingers and pens let go on lift.
      if (e.pointerType === 'mouse' && e.type !== 'pointerleave') return;
      if (pointerActive) relax();
    };
    scene.addEventListener('pointerup', release);
    scene.addEventListener('pointercancel', release);
    scene.addEventListener('pointerleave', release);

    addEventListener('scroll', () => { rect = null; }, { passive: true });
    addEventListener('resize', () => {
      rect = null;
      sceneWidth = scene.offsetWidth;
    });

    /* ---------------- Tilt (gyroscope) ---------------- */
    const orientationSupported = 'DeviceOrientationEvent' in window;
    const needsPermission = orientationSupported
      && typeof DeviceOrientationEvent.requestPermission === 'function';
    let gyroListening = false;
    let baseline = null;
    let lastReading = 0;
    let motionBtnTimer = 0;

    function screenAngle() {
      const a = screen.orientation && typeof screen.orientation.angle === 'number'
        ? screen.orientation.angle
        : (window.orientation || 0);
      return ((a % 360) + 360) % 360;
    }

    function onOrientation(e) {
      if (e.beta == null || e.gamma == null) return; // desktops may fire one empty event

      // beta = front/back tilt and gamma = left/right tilt, both measured on the phone's
      // natural portrait axes. Remap them onto the axes of the screen as currently rotated.
      let lr, fb;
      switch (screenAngle()) {
        case 90:  lr = e.beta;   fb = -e.gamma; break;
        case 180: lr = -e.gamma; fb = -e.beta;  break;
        case 270: lr = -e.beta;  fb = e.gamma;  break;
        default:  lr = e.gamma;  fb = e.beta;
      }

      // "Neutral" is however the phone is being held. The baseline drifts towards the
      // current pose (time constant ≈ 4 s) so the card re-centres instead of staying tilted.
      const now = e.timeStamp || performance.now();
      const dt = lastReading ? clamp(now - lastReading, 0, 200) : 0;
      lastReading = now;
      if (!baseline) baseline = { lr, fb };
      const k = 1 - Math.exp(-dt / 4000);
      baseline.lr += (lr - baseline.lr) * k;
      baseline.fb += (fb - baseline.fb) * k;

      const dLR = clamp(lr - baseline.lr, -30, 30);
      const dFB = clamp(fb - baseline.fb, -30, 30);

      // The card leans the same way as the phone, amplified (~20° of phone = full 12°).
      // gamma > 0 means the right edge moved away → +rotateY.
      // beta  > 0 means the top edge came closer  → −rotateX.
      gyroTarget = {
        x: clamp(-dFB * 0.6, -MAX_TILT, MAX_TILT),
        y: clamp(dLR * 0.6, -MAX_TILT, MAX_TILT)
      };
      gyroLive = true;
      motionBtn.hidden = true;
      if (!pointerActive) {
        target.x = gyroTarget.x;
        target.y = gyroTarget.y;
        animate();
      }
    }

    function startGyro() {
      if (gyroListening || reduced || !orientationSupported) return;
      baseline = null;
      lastReading = 0;
      addEventListener('deviceorientation', onOrientation);
      gyroListening = true;
    }

    function stopGyro() {
      if (!gyroListening) return;
      removeEventListener('deviceorientation', onOrientation);
      gyroListening = false;
      gyroLive = false;
      gyroTarget = null;
      if (!pointerActive) relax();
    }

    function syncMotion() {
      clearTimeout(motionBtnTimer);
      if (reduced || !orientationSupported) {
        stopGyro();
        motionBtn.hidden = true;
        return;
      }
      // Listening is harmless before permission: iOS simply sends nothing until it's granted.
      startGyro();
      // iOS 13+ only grants sensor access from an explicit tap. Recent Chromium also exposes
      // requestPermission but sends readings without it, so only offer the button when
      // no readings have arrived on their own.
      if (needsPermission && coarsePointer.matches && !gyroLive) {
        motionBtnTimer = setTimeout(() => { motionBtn.hidden = gyroLive; }, 800);
      }
    }

    motionBtn.addEventListener('click', () => {
      DeviceOrientationEvent.requestPermission()
        .then((state) => {
          if (state === 'granted') {
            motionBtn.hidden = true;
            baseline = null;
            startGyro();
            toast('Motion on: tilt your phone');
          } else {
            toast('Motion access was declined');
          }
        })
        .catch(() => toast('Motion is not available here'));
    });

    const resetBaseline = () => { baseline = null; };
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', resetBaseline);
    }
    addEventListener('orientationchange', resetBaseline);
    document.addEventListener('visibilitychange', resetBaseline);

    /* ---------------- Reduced motion ---------------- */
    function onReducedChange() {
      reduced = reducedQuery.matches;
      if (reduced) {
        pointerActive = false;
        target.x = target.y = current.x = current.y = 0;
        render();
      }
      syncMotion();
      updateHint();
    }
    if (reducedQuery.addEventListener) reducedQuery.addEventListener('change', onReducedChange);
    else reducedQuery.addListener(onReducedChange);

    function updateHint() {
      const fine = finePointer.matches;
      const action = fine ? 'Click' : 'Tap';
      hint.textContent = reduced
        ? `${action} the card to flip`
        : `${action} the card to flip · ${fine ? 'hover' : 'drag'} to tilt`;
    }

    /* ---------------- Share ---------------- */
    let toastTimer = 0;
    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 2600);
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch (_) { /* fall back below */ }
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      ta.remove();
      if (!ok) throw new Error('Copy failed');
    }

    shareBtn.addEventListener('click', async () => {
      const url = location.href.split('#')[0];
      const data = { title: SHARE_TITLE, url };
      if (navigator.share && (!navigator.canShare || navigator.canShare(data))) {
        try {
          await navigator.share(data);
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return; // the person closed the share sheet
        }
      }
      try {
        await copyText(url);
        toast('Link copied to clipboard');
      } catch (_) {
        toast(`Copy this link: ${url}`);
      }
    });

    /* ---------------- QR code ---------------- */
    function renderQR() {
      if (typeof window.qrcode !== 'function') return showQRFallback();
      const qr = window.qrcode(0, 'M'); // version 0 = smallest that fits; error correction M
      qr.addData(PORTFOLIO_URL);
      qr.make();

      const n = qr.getModuleCount();
      const quiet = 4; // quiet zone, in modules
      const size = n + quiet * 2;
      let d = '';
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          if (!qr.isDark(r, c)) continue;
          let run = 1; // merge each horizontal run of dark modules into one rectangle
          while (c + run < n && qr.isDark(r, c + run)) run++;
          d += `M${c + quiet} ${r + quiet}h${run}v1h-${run}z`;
          c += run - 1;
        }
      }
      qrBox.innerHTML =
        `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code linking to ${PORTFOLIO_URL}" shape-rendering="crispEdges">` +
        `<rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#1c1c1c"/></svg>`;
    }

    function showQRFallback() {
      qrBox.classList.add('qr--fallback');
      qrBox.textContent = 'QR code unavailable';
    }

    const qrLib = $('qr-lib');
    if (typeof window.qrcode === 'function') renderQR();
    else if (qrLib) {
      qrLib.addEventListener('load', renderQR);
      qrLib.addEventListener('error', showQRFallback);
    } else showQRFallback();

    /* ---------------- Init ---------------- */
    updateHint();
    syncMotion();
    render();
  })();
  </script>
</body>
</html>
